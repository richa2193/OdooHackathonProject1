<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FacultyFlow | Student Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/style.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --sidebar-bg: #0f172a;
      --sidebar-text: #94a3b8;
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
    }

    [data-theme="dark"] {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --text-main: #f8fafc;
      --text-muted: #a1a1aa;
      --border-color: #27272a;
      --sidebar-bg: #09090b;
      --sidebar-text: #a1a1aa;
      --primary-color: #6366f1;
      --primary-hover: #818cf8;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .app-wrapper {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styles */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      color: #ffffff;
      flex-shrink: 0;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      z-index: 100;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      height: 36px;
      width: 36px;
      border-radius: 8px;
      background-color: var(--primary-color);
      color: white;
      font-weight: 800;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-menu {
      padding: 20px 14px;
      flex: 1;
      list-style: none;
      margin: 0;
    }

    .menu-item {
      margin-bottom: 6px;
    }

    .menu-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .menu-link:hover, .menu-link.active {
      color: #ffffff;
      background-color: rgba(99, 102, 241, 0.15);
    }

    .menu-link.active i {
      color: var(--primary-color);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .top-nav {
      height: 70px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-toggle-btn {
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .user-avatar {
      height: 38px;
      width: 38px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #e2e8f0;
    }

    .content-body {
      padding: 30px;
      flex: 1;
    }

    .table-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
    }

    .form-control-custom {
      background-color: transparent !important;
      border: 1px solid var(--border-color) !important;
      color: var(--text-main) !important;
      border-radius: 8px !important;
      font-size: 13px !important;
    }

    .form-control-custom:focus {
      border-color: var(--primary-color) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1) !important;
    }

    .table th {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border-color);
      padding: 14px 10px;
    }

    .table td {
      font-size: 13px;
      padding: 14px 10px;
      vertical-align: middle;
      border-bottom: 1px solid var(--border-color);
    }

    .action-btn {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .toggle-sidebar-btn {
      display: none;
    }

    @media (max-width: 991.98px) {
      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        bottom: 0;
      }
      .sidebar.show {
        left: 0;
      }
      .toggle-sidebar-btn {
        display: inline-flex;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-main);
        padding: 6px 12px;
        border-radius: 8px;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Sidebar -->
    <aside id="app-sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">FF</div>
        <span class="fs-5 fw-bold text-white tracking-wide">FacultyFlow</span>
      </div>

      <ul class="sidebar-menu">
        <li class="menu-item">
          <a href="dashboard.html" class="menu-link">
            <i class="bi bi-grid-1x2-fill"></i>Dashboard
          </a>
        </li>
        <li class="menu-item">
          <a href="#" class="menu-link active">
            <i class="bi bi-mortarboard-fill"></i>Manage Students
          </a>
        </li>
        <li class="menu-item">
          <a href="attendance.html" class="menu-link">
            <i class="bi bi-calendar-check-fill"></i>Attendance Sheet
          </a>
        </li>
        <li class="menu-item">
          <a href="/profile" class="menu-link">
            <i class="bi bi-person-fill-gear"></i>Settings
          </a>
        </li>
      </ul>

      <div class="p-3 border-top border-secondary-subtle mt-auto">
        <button onclick="handleLogout()" class="btn btn-outline-danger w-full text-start d-flex align-items-center gap-2 border-0 w-100 py-2.5 px-3 rounded-3" style="font-size: 13px; font-weight: 600;">
          <i class="bi bi-box-arrow-right"></i>Log Out
        </button>
      </div>
    </aside>

    <!-- Main Container -->
    <main class="main-content">
      <!-- Top Navbar -->
      <header class="top-nav">
        <div class="d-flex align-items-center">
          <button id="toggle-sidebar" class="toggle-sidebar-btn" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
          </button>
          <h2 class="h5 fw-bold mb-0">Student Administration</h2>
        </div>

        <div class="d-flex align-items-center gap-3">
          <!-- Dark Mode Button -->
          <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">
            <i id="theme-icon" class="bi bi-moon-fill"></i>
          </button>

          <!-- User Profile -->
          <div class="user-profile">
            <img id="user-avatar" class="user-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" alt="Avatar">
            <div class="d-none d-md-block text-start leading-tight">
              <div id="user-name" class="fw-bold small">Dr. Sarah Jenkins</div>
              <div id="user-role" class="text-muted" style="font-size: 10px; text-transform: uppercase;">FACULTY</div>
            </div>
          </div>
        </div>
      </header>

      <!-- Content Body -->
      <section class="content-body">
        
        <!-- Header Actions -->
        <div class="d-flex flex-column sm:flex-row justify-content-between align-items-start sm:align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 fw-extrabold mb-1">Student Registry</h1>
            <p class="text-muted small mb-0">View, add, edit or remove student enrollment records.</p>
          </div>
          <button class="btn btn-primary d-flex align-items-center gap-1.5 px-4 py-2 rounded-3 border-0" style="background-color: var(--primary-color);" onclick="openAddModal()">
            <i class="bi bi-plus-lg"></i> Add Student
          </button>
        </div>

        <!-- Table Card -->
        <div class="table-container">
          <!-- Filter Search -->
          <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
              <div class="position-relative">
                <input type="text" id="search-input" class="form-control form-control-custom" placeholder="Search by name or code..." oninput="handleSearch()">
              </div>
            </div>
          </div>

          <!-- Students Table -->
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Student Code</th>
                  <th>Email</th>
                  <th>GPA</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="students-table-body">
                <!-- Injected via JavaScript -->
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="d-flex justify-content-between align-items-center mt-4">
            <span class="text-muted small" id="pagination-info">Showing 1 to 5 of 10 students</span>
            <nav aria-label="Page navigation">
              <ul class="pagination pagination-sm mb-0 gap-1" id="pagination-controls">
                <!-- Injected via JavaScript -->
              </ul>
            </nav>
          </div>

        </div>

      </section>
    </main>
  </div>

  <!-- ADD / EDIT MODAL -->
  <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom-0 pb-0">
          <h5 class="modal-title fw-bold" id="studentModalLabel">Add New Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="student-form" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="student-idx">
          <div class="modal-body py-3">
            <div class="mb-3">
              <label for="modal-name" class="form-label small fw-bold">Full Name</label>
              <input type="text" id="modal-name" class="form-control form-control-custom" required>
            </div>
            <div class="mb-3">
              <label for="modal-code" class="form-label small fw-bold">Student Code</label>
              <input type="text" id="modal-code" class="form-control form-control-custom" placeholder="STU101" required>
            </div>
            <div class="mb-3">
              <label for="modal-email" class="form-label small fw-bold">Email Address</label>
              <input type="email" id="modal-email" class="form-control form-control-custom" required>
            </div>
            <div class="mb-3">
              <label for="modal-gpa" class="form-label small fw-bold">GPA Cumulative</label>
              <input type="number" step="0.1" min="0" max="10" id="modal-gpa" class="form-control form-control-custom" required>
            </div>
          </div>
          <div class="modal-footer border-top-0 pt-0">
            <button type="button" class="btn btn-light rounded-3 text-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-3 px-4 border-0" style="background-color: var(--primary-color);">Save Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Theme Toggle
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('ff_theme', target);
      updateThemeIcon(target);
    }

    function updateThemeIcon(theme) {
      const themeIcon = document.getElementById('theme-icon');
      if (theme === 'dark') {
        themeIcon.className = 'bi bi-sun-fill';
      } else {
        themeIcon.className = 'bi bi-moon-fill';
      }
    }

    // Load initial theme
    const theme = localStorage.getItem('ff_theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeIcon(theme);

    // Sidebar Toggle
    function toggleSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      sidebar.classList.toggle('show');
    }

    // Auth validation
    let user = null;
    try {
      user = JSON.parse(localStorage.getItem('ff_auth'));
    } catch(e) {}

    if (!user) {
      window.location.href = '/login.html';
    }

    document.getElementById('user-name').textContent = user.name;
    document.getElementById('user-role').textContent = user.role;
    if (user.avatar) {
      document.getElementById('user-avatar').src = user.avatar;
    }

    // Manage Local DB for Students
    let students = [];
    const defaultStudents = [
      { id: 'student1', name: 'Ayushi Sharma', studentCode: 'STU101', email: 'ayushi.s@student.edu', gpa: 8.7 },
      { id: 'student2', name: 'Karena Roy', studentCode: 'STU102', email: 'karena.r@student.edu', gpa: 7.9 },
      { id: 'student3', name: 'Rohan Gupta', studentCode: 'STU103', email: 'rohan.g@student.edu', gpa: 8.1 },
      { id: 'student4', name: 'Sneha Patel', studentCode: 'STU104', email: 'sneha.p@student.edu', gpa: 9.2 },
      { id: 'student5', name: 'Vikram Singh', studentCode: 'STU105', email: 'vikram.s@student.edu', gpa: 6.8 },
      { id: 'student6', name: 'Priya Sharma', studentCode: 'STU106', email: 'priya.s@student.edu', gpa: 8.9 }
    ];

    function loadStudents() {
      const local = localStorage.getItem('ff_students');
      if (local) {
        students = JSON.parse(local);
      } else {
        students = defaultStudents;
        localStorage.setItem('ff_students', JSON.stringify(students));
      }
    }

    loadStudents();

    // Search and Pagination Parameters
    let searchQuery = '';
    let currentPage = 1;
    const recordsPerPage = 5;

    let bootstrapModal;
    document.addEventListener('DOMContentLoaded', () => {
      bootstrapModal = new bootstrap.Modal(document.getElementById('studentModal'));
      renderTable();
    });

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.toLowerCase();
      currentPage = 1;
      renderTable();
    }

    function renderTable() {
      // Filter list
      const filtered = students.filter(
        s => s.name.toLowerCase().includes(searchQuery) || s.studentCode.toLowerCase().includes(searchQuery)
      );

      // Pagination slices
      const totalRecords = filtered.length;
      const totalPages = Math.ceil(totalRecords / recordsPerPage) || 1;
      
      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const startIndex = (currentPage - 1) * recordsPerPage;
      const endIndex = Math.min(startIndex + recordsPerPage, totalRecords);
      const paginated = filtered.slice(startIndex, endIndex);

      // Populate body
      const tbody = document.getElementById('students-table-body');
      tbody.innerHTML = '';

      if (paginated.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted small">No students found.</td></tr>`;
      } else {
        paginated.forEach((s) => {
          const originalIdx = students.findIndex(stud => stud.id === s.id);
          tbody.innerHTML += `
            <tr>
              <td class="fw-semibold">${s.name}</td>
              <td class="font-mono small">${s.studentCode}</td>
              <td class="text-secondary">${s.email}</td>
              <td><span class="badge bg-indigo-subtle text-primary border border-indigo-subtle px-2.5 py-1 rounded">${s.gpa}</span></td>
              <td class="text-end">
                <button class="btn btn-outline-secondary action-btn me-1" onclick="openEditModal(${originalIdx})"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-outline-danger action-btn" onclick="handleDeleteStudent(${originalIdx})"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          `;
        });
      }

      // Update Info Label
      document.getElementById('pagination-info').textContent = totalRecords > 0 
        ? `Showing ${startIndex + 1} to ${endIndex} of ${totalRecords} students` 
        : `Showing 0 to 0 of 0 students`;

      // Update controls
      const pagControls = document.getElementById('pagination-controls');
      pagControls.innerHTML = '';
      
      // Previous Button
      pagControls.innerHTML += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
          <button class="page-link rounded" onclick="changePage(${currentPage - 1})"><i class="bi bi-chevron-left"></i></button>
        </li>
      `;

      // Pages Buttons
      for (let i = 1; i <= totalPages; i++) {
        pagControls.innerHTML += `
          <li class="page-item ${currentPage === i ? 'active' : ''}">
            <button class="page-link rounded" onclick="changePage(${i})">${i}</button>
          </li>
        `;
      }

      // Next Button
      pagControls.innerHTML += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
          <button class="page-link rounded" onclick="changePage(${currentPage + 1})"><i class="bi bi-chevron-right"></i></button>
        </li>
      `;
    }

    function changePage(page) {
      currentPage = page;
      renderTable();
    }

    function openAddModal() {
      document.getElementById('studentModalLabel').textContent = 'Add New Student';
      document.getElementById('student-idx').value = '';
      document.getElementById('modal-name').value = '';
      document.getElementById('modal-code').value = '';
      document.getElementById('modal-email').value = '';
      document.getElementById('modal-gpa').value = '';
      bootstrapModal.show();
    }

    function openEditModal(idx) {
      const s = students[idx];
      document.getElementById('studentModalLabel').textContent = 'Edit Student Record';
      document.getElementById('student-idx').value = idx;
      document.getElementById('modal-name').value = s.name;
      document.getElementById('modal-code').value = s.studentCode;
      document.getElementById('modal-email').value = s.email;
      document.getElementById('modal-gpa').value = s.gpa;
      bootstrapModal.show();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      
      const idxVal = document.getElementById('student-idx').value;
      const name = document.getElementById('modal-name').value;
      const studentCode = document.getElementById('modal-code').value;
      const email = document.getElementById('modal-email').value;
      const gpa = parseFloat(document.getElementById('modal-gpa').value);

      if (idxVal === '') {
        // ADD
        const newStud = {
          id: 'stu_' + Date.now(),
          name,
          studentCode,
          email,
          gpa
        };
        students.push(newStud);
      } else {
        // EDIT
        const idx = parseInt(idxVal);
        students[idx].name = name;
        students[idx].studentCode = studentCode;
        students[idx].email = email;
        students[idx].gpa = gpa;
      }

      localStorage.setItem('ff_students', JSON.stringify(students));
      bootstrapModal.hide();
      renderTable();
    }

    function handleDeleteStudent(idx) {
      if (confirm(`Are you sure you want to remove ${students[idx].name}?`)) {
        students.splice(idx, 1);
        localStorage.setItem('ff_students', JSON.stringify(students));
        renderTable();
      }
    }

    function handleLogout() {
      localStorage.removeItem('ff_auth');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
